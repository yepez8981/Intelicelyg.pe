<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>Mantenimiento | Intelicelyg.pe</title>
<style>
:root{--primary:#0ea5e9;--primary-dark:#0284c7;--secondary:#38bdf8;--dark:#0f172a;--dark2:#172033;--muted:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(circle at 15% 10%,rgba(56,189,248,.18),transparent 30%),linear-gradient(135deg,#0f172a,#172033);color:#fff;overflow:hidden}
.wrap{width:100%;max-width:560px;text-align:center;position:relative}
.card{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.10);backdrop-filter:blur(14px);border-radius:30px;padding:50px 35px;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.badge{display:inline-block;padding:7px 13px;border-radius:50px;background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.25);color:#7dd3fc;font-size:11px;font-weight:800;letter-spacing:1px;margin-bottom:22px}
.logo{font-size:31px;font-weight:900;letter-spacing:-1.5px;margin-bottom:34px}.logo span{color:var(--secondary)}
.icon{width:92px;height:92px;margin:0 auto 25px;border-radius:27px;display:flex;align-items:center;justify-content:center;font-size:42px;background:rgba(56,189,248,.10);border:1px solid rgba(56,189,248,.20);animation:float 2.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(2deg)}}
h1{font-size:30px;letter-spacing:-1px;margin-bottom:13px}p{color:#cbd5e1;font-size:14px;line-height:1.75;max-width:430px;margin:auto}.loader{width:180px;height:5px;background:rgba(255,255,255,.10);border-radius:10px;margin:28px auto 18px;overflow:hidden}.loader span{display:block;width:45%;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--primary),var(--secondary));animation:load 1.6s ease-in-out infinite}@keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(400%)}}.small{font-size:11px;color:var(--muted)}.footer{margin-top:18px;font-size:11px;color:#64748b}.footer strong{color:#94a3b8}@media(max-width:500px){.card{padding:40px 24px;border-radius:24px}h1{font-size:26px}.logo{font-size:27px}}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="badge">INTELICELYG.PE</div><div class="logo">Inteli<span>Cel</span></div><div class="icon">🛠️</div><h1>Estamos actualizando la plataforma</h1><p>Estamos realizando mejoras para ofrecerte una experiencia más rápida, segura y completa. Por favor, vuelve a intentarlo en unos minutos.</p><div class="loader"><span></span></div><div class="small">Actualización en progreso...</div></div><div class="footer">© 2026 <strong>Intelicelyg.pe</strong> · Volveremos pronto</div></div>
</body>
</html>
